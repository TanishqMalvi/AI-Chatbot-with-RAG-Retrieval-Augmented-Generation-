name: CI – Build, Test & Eval Gate

on:
  push:
    branches: [main, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main]

# Minimal default permissions – each job overrides only what it needs
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Lint & type check
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install ruff mypy pydantic-settings python-jose passlib structlog fastapi pydantic

      - name: Run ruff (linting)
        run: ruff check app/ eval/ tests/

      - name: Run mypy (type checking)
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # non-blocking until full type annotations added

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Unit & integration tests
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          APP_ENV: development
          OPENAI_API_KEY: "test-key-not-real"
          JWT_SECRET_KEY: "test-secret-key-for-ci-only"
          REDIS_URL: redis://localhost:6379/0
          VECTOR_DB: chroma
          CHROMA_PERSIST_DIR: /tmp/test-chroma
          ENABLE_PII_REDACTION: "true"
          ENABLE_PROMPT_INJECTION_CHECK: "true"
          ENABLE_HALLUCINATION_CHECK: "false"
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Security scan (SAST)
  # ─────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: Run Bandit (SAST)
        run: bandit -r app/ -ll --exit-zero

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Docker build validation
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: healthtech/rag-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Eval gate (offline evaluation – runs on main branch only)
  #    Blueprint §10: Regression tests in CI
  # ─────────────────────────────────────────────────────────────────────────
  eval-gate:
    name: Eval Regression Gate
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    # In production: spin up the service and run evaluator.py against it
    # For CI: run metric unit tests as a proxy for the full eval pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run metric regression tests
        env:
          OPENAI_API_KEY: "test-key"
          JWT_SECRET_KEY: "test-secret"
        run: |
          python -c "
          from eval.evaluator import token_f1, recall_at_k, reciprocal_rank

          # Regression assertions on metric implementations
          assert token_f1('hello world', 'hello world') == 1.0
          assert token_f1('', 'hello') == 0.0
          assert recall_at_k(['a', 'b'], ['a'], k=10) == 1.0
          assert reciprocal_rank(['a', 'b'], ['a']) == 1.0
          assert reciprocal_rank(['x', 'a'], ['a']) == 0.5
          print('All regression metric assertions passed.')
          "

      - name: Validate golden set format
        run: |
          python -c "
          import json
          from pathlib import Path
          golden = json.loads(Path('eval/golden_set.json').read_text())
          assert len(golden) >= 20, f'Expected >=20 QA pairs, got {len(golden)}'
          for qa in golden:
              assert 'id' in qa, f'Missing id in {qa}'
              assert 'question' in qa
              assert 'reference_answer' in qa
          print(f'Golden set validation passed: {len(golden)} QA pairs')
          "
