apiVersion: v1
kind: Service
metadata:
  name: healthtech-rag-api
  namespace: healthtech
  labels:
    app: healthtech-rag-api
spec:
  selector:
    app: healthtech-rag-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthtech-rag-ingress
  namespace: healthtech
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rag.healthtech.io
      secretName: healthtech-rag-tls
  rules:
    - host: rag.healthtech.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthtech-rag-api
                port:
                  number: 80
