apiVersion: v1
kind: ConfigMap
metadata:
  name: healthtech-rag-config
  namespace: healthtech
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "openai"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-large"
  OPENAI_CHAT_MODEL: "gpt-4o-mini"
  VECTOR_DB: "pinecone"
  RETRIEVAL_TOP_K: "20"
  RERANK_TOP_N: "6"
  MAX_CONTEXT_CHUNKS: "6"
  ENABLE_PII_REDACTION: "true"
  ENABLE_PROMPT_INJECTION_CHECK: "true"
  ENABLE_HALLUCINATION_CHECK: "true"
  CONFIDENCE_THRESHOLD: "0.35"
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_PROJECT: "healthtech-rag-prod"
  INGEST_BATCH_SIZE: "32"
---
# Secrets are managed via your KMS / Vault integration.
# In production: mount secrets from AWS Secrets Manager, HashiCorp Vault, or K8s ExternalSecrets.
# The Secret below is a TEMPLATE ONLY – do not store real values here.
apiVersion: v1
kind: Secret
metadata:
  name: healthtech-rag-secrets
  namespace: healthtech
  annotations:
    # Use external-secrets operator to sync from AWS Secrets Manager / Vault
    # external-secrets.io/secret-store: "aws-secretsmanager"
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_WITH_KMS_OR_VAULT_VALUE"
  ANTHROPIC_API_KEY: "REPLACE_WITH_KMS_OR_VAULT_VALUE"
  PINECONE_API_KEY: "REPLACE_WITH_KMS_OR_VAULT_VALUE"
  JWT_SECRET_KEY: "REPLACE_WITH_KMS_OR_VAULT_VALUE"
  REDIS_URL: "REPLACE_WITH_KMS_OR_VAULT_VALUE"
  INGEST_WEBHOOK_SECRET: "REPLACE_WITH_KMS_OR_VAULT_VALUE"
  LANGCHAIN_API_KEY: "REPLACE_WITH_KMS_OR_VAULT_VALUE"
